# Disable Zephyr console in mcuboot (keep it lean)
CONFIG_CONSOLE=n

# Multithreading
CONFIG_MULTITHREADING=y

# MCUBoot settings (BOOT_MAX_IMG_SECTORS: leave unset — this MCUboot
# revision defaults to BOOT_MAX_IMG_SECTORS_AUTO and sizes from the DT)
# MCUboot serial recovery (brick insurance over USB CDC — matches
# tikk-pouch-demo)
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_CDC_ACM=y
CONFIG_MCUBOOT_INDICATION_LED=y

# Boot partition size comes from the board DT (promicro_nrf52840's
# nrf52840_partition.dtsi: boot_partition 0x0..0xc000) — on pure
# Zephyr there is no PM_PARTITION_SIZE_MCUBOOT (that's NCS-only and a
# hard Kconfig error under sysbuild's handwritten-conf strict mode).

# Pure MCUboot at 0x0 — no Nordic MBR/softdevice underneath (same as
# the app's board conf; keeps the whole flash map self-consistent)
CONFIG_BOARD_HAS_NRF5_BOOTLOADER=n
