# Tikk liquid tilt display — lean app (no pouch/BT/mcuboot)
#
# Accel -> wave sim -> LED matrix, plus micro-ROS tilt publisher over USB-CDC.

CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LED=y

CONFIG_TIKK_LED_MATRIX=y

# float printf support for bring-up logs
CONFIG_CBPRINTF_FP_SUPPORT=y

# SPIKE (pouch stage): picolibc instead of newlib — pouch requires picolibc.
# Testing whether libmicroros rebuilds cleanly against it with a fresh
# colcon cache (previous Annex K __errno_t failure may have been stale cache).
CONFIG_PICOLIBC=y

CONFIG_REGULATOR=y

# --- OTA image management (pouch OTA swaps via mcuboot) ---

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_STREAM_FLASH=y

# --- Pouch (Golioth over BLE GATT) + OTA ---

CONFIG_BT=y
CONFIG_BT_SMP=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Tikk micro-ROS"
CONFIG_BT_DEVICE_APPEARANCE=768

CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247

# This is needed due to an off-by-one error in Kconfig defaults
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

CONFIG_BT_RX_STACK_SIZE=4096

CONFIG_MAIN_STACK_SIZE=4096

CONFIG_MBEDTLS_HEAP_SIZE=9192

# This option is implied by BT_SMP and breaks secp384r1 support
CONFIG_MBEDTLS_PSA_P256M_DRIVER_ENABLED=n

CONFIG_LOG=y
CONFIG_ZCBOR=y
CONFIG_REBOOT=y

CONFIG_POUCH=y
CONFIG_POUCH_TRANSPORT_BLE_GATT=y

CONFIG_GOLIOTH=y
CONFIG_GOLIOTH_SETTINGS=y
CONFIG_GOLIOTH_OTA=y

# --- Credentials on LittleFS (provisioned via mcumgr over the console) ---

CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y

CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_SHELL=y
CONFIG_UART_CONSOLE_MCUMGR=y
CONFIG_CRC=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_GRP_FS=y
CONFIG_MCUMGR_GRP_FS_FILE_ACCESS_HOOK=y
CONFIG_SHELL=y

# --- micro-ROS over USB CDC ACM ---

CONFIG_MICROROS=y
CONFIG_CPP=y
CONFIG_MICROROS_TRANSPORT_SERIAL_USB=y

# Two publishers: /tilt (10 Hz) and /temp (1 Hz, TMP102). This maps to
# RMW_UXRCE_MAX_PUBLISHERS in the libmicroros colcon build (requires a
# full colcon rebuild when changed — patches 0001/0002 flow handles it).
# NOTE: these MICROROS_* symbols are Kconfig STRINGS — quotes required.
CONFIG_MICROROS_PUBLISHERS="2"

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y

# Let the micro-ROS transport's usb_enable() bring up USB. If USB comes up
# at boot instead, usb_enable() returns -EALREADY and the transport treats
# it as fatal ("Failed to enable USB") and the micro-ROS thread exits.
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n

# POSIX_API is deliberately NOT set: with it, <arpa/inet.h> resolves to
# Zephyr's POSIX headers which don't define AF_INET6 without full
# NETWORKING — mbedtls x509 then calls libc inet_pton (unimplemented on
# picolibc) and the link fails. Without POSIX_API, AF_INET6 comes from
# picolibc's headers and mbedtls uses its own software parser. The demo
# app (tikk-pouch-demo) links the same stack with POSIX_API off.
# clock_gettime/CLOCK_REALTIME for the micro-ROS publisher timestamps.
# NOTE: POSIX_API is deliberately NOT set (see below) — POSIX_TIMERS
# provides just the clock, without pulling Zephyr's POSIX header routing.
CONFIG_POSIX_TIMERS=y

CONFIG_MAIN_STACK_SIZE=4096
