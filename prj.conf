# Tikk liquid tilt display — lean app (no pouch/BT/mcuboot)
#
# Accel -> wave sim -> LED matrix, plus micro-ROS tilt publisher over USB-CDC.

CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LED=y

CONFIG_TIKK_LED_MATRIX=y

# float printf support for bring-up logs
CONFIG_CBPRINTF_FP_SUPPORT=y

# SPIKE (pouch stage): picolibc instead of newlib — pouch requires picolibc.
# Testing whether libmicroros rebuilds cleanly against it with a fresh
# colcon cache (previous Annex K __errno_t failure may have been stale cache).
CONFIG_PICOLIBC=y

CONFIG_REGULATOR=y

# --- OTA image management (pouch OTA swaps via mcuboot) ---

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_STREAM_FLASH=y

# --- Pouch (Golioth over BLE GATT) + OTA ---

CONFIG_BT=y
CONFIG_BT_SMP=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Tikk micro-ROS"
CONFIG_BT_DEVICE_APPEARANCE=768

CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247

# This is needed due to an off-by-one error in Kconfig defaults
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

CONFIG_BT_RX_STACK_SIZE=4096

CONFIG_MAIN_STACK_SIZE=4096

CONFIG_MBEDTLS_HEAP_SIZE=9192

# This option is implied by BT_SMP and breaks secp384r1 support
CONFIG_MBEDTLS_PSA_P256M_DRIVER_ENABLED=n

# Per pouch v0.2.0 example: allow centrals that lose bond info to
# re-pair (the gateway must be able to pair across device resets/changes)
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y

# Turn off default options to reduce ROM usage
CONFIG_MBEDTLS_PKCS5_C=n

# No MBEDTLS_LEGACY_CRYPTO_C here: that Kconfig is NCS-only (gates the
# legacy crypto API surface in Nordic's fork). Pure Zephyr 4.4 uses
# vanilla mbedtls/tf-psa-crypto, which provides the raw EC APIs that
# pouch v0.2.0's src/cert.c needs (mbedtls_pk_ec et al.) — proven by
# the DK reference build completing its cert upload on 4.4.

CONFIG_LOG=y
CONFIG_ZCBOR=y
CONFIG_REBOOT=y

CONFIG_POUCH=y
CONFIG_POUCH_TRANSPORT_BLE_GATT=y

CONFIG_GOLIOTH=y
CONFIG_GOLIOTH_SETTINGS=y
CONFIG_GOLIOTH_OTA=y

# --- Credentials on LittleFS (provisioned via mcumgr over the console) ---

CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y

CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_SHELL=y

# The shell SMP transport depends on BASE64 — pouch <= pre-v0.2.0 used to
# 'select BASE64' itself; v0.2.0 dropped that, and without this line the
# whole MCUMGR_TRANSPORT_SHELL block silently vanishes (no 'mcumgr' shell
# command, smpmgr timeouts). Bit us once.
CONFIG_BASE64=y

# fs shell commands (ls/cat) — for inspecting /lfs1 from the console
CONFIG_FILE_SYSTEM_SHELL=y
CONFIG_UART_CONSOLE_MCUMGR=y
CONFIG_CRC=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_GRP_FS=y
CONFIG_MCUMGR_GRP_FS_FILE_ACCESS_HOOK=y
CONFIG_SHELL=y

# --- micro-ROS over USB CDC ACM ---

CONFIG_MICROROS=y
CONFIG_CPP=y
CONFIG_MICROROS_TRANSPORT_SERIAL_USB=y

# Two publishers: /tilt (10 Hz) and /temp (1 Hz, TMP102). This maps to
# RMW_UXRCE_MAX_PUBLISHERS in the libmicroros colcon build (requires a
# full colcon rebuild when changed — patches 0001/0002 flow handles it).
# NOTE: these MICROROS_* symbols are Kconfig STRINGS — quotes required.
CONFIG_MICROROS_PUBLISHERS="2"

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y

# Let the micro-ROS transport's usb_enable() bring up USB. If USB comes up
# at boot instead, usb_enable() returns -EALREADY and the transport treats
# it as fatal ("Failed to enable USB") and the micro-ROS thread exits.
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n

# Zephyr 4.4 ships the new "device_next" USB stack alongside the legacy
# one. The zephyr,cdc-acm-uart node in the board overlay makes the new
# stack's CDC class default to y, and BOTH stacks then instantiate the
# same devicetree node -> __device_dts_ord_* multiply defined at link.
# The micro-ROS serial-usb transport selects the legacy stack
# (usb_enable() API); keep device_next off.
CONFIG_USB_DEVICE_STACK_NEXT=n

# POSIX_API is deliberately NOT set: with it, <arpa/inet.h> resolves to
# Zephyr's POSIX headers which don't define AF_INET6 without full
# NETWORKING — mbedtls x509 then calls libc inet_pton (unimplemented on
# picolibc) and the link fails. Without POSIX_API, AF_INET6 comes from
# picolibc's headers and mbedtls uses its own software parser. The demo
# app (tikk-pouch-demo) links the same stack with POSIX_API off.
# clock_gettime/CLOCK_REALTIME for the micro-ROS publisher timestamps.
# Zephyr 4.4 re-parented POSIX_TIMERS under the "POSIX System Interfaces"
# umbrella; enabling that routes <time.h>/<unistd.h>/... to Zephyr's
# include/zephyr/posix headers (-I on every TU), which shadow the libc's
# own POSIX declarations and broke the colcon build of rcutils (implicit
# isatty/fork/execvp under gcc >= 14) — the same header-routing family
# as the CONFIG_POSIX_API trap documented below. All POSIX header
# routing stays OFF on 4.4: the app provides the clock functions that
# micro-ROS needs in src/posix_clock.c (mirroring zephyr's own
# lib/posix/options/clock.c on the kernel sys_clock_* API), and
# picolibc's <time.h> supplies the declarations by default.

CONFIG_MAIN_STACK_SIZE=4096
