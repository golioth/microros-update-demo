CONFIG_LOG_BACKEND_UART=y

# Run nrf52840_power.c at init (bumps REGOUT0 to 3.0V when USB powered)
CONFIG_BOARD_EARLY_INIT_HOOK=y

# No bootloader: link app at 0x0 for direct boot (no MBR/MCUboot offset).
# Same as tikk-fleet apps; the default y places app at 0x1000 behind an MBR
# that this build never actually includes.
CONFIG_BOARD_HAS_NRF5_BOOTLOADER=n

# Add-on board VCC rail switch
CONFIG_REGULATOR=y
