# Disable Zephyr console in mcuboot (keep it lean)
CONFIG_CONSOLE=n

# Multithreading
CONFIG_MULTITHREADING=y

# MCUBoot settings
CONFIG_BOOT_MAX_IMG_SECTORS=256

# MCUboot serial recovery (brick insurance over USB CDC — matches
# tikk-pouch-demo)
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_CDC_ACM=y
CONFIG_MCUBOOT_INDICATION_LED=y

CONFIG_PM_PARTITION_SIZE_MCUBOOT=0x10000

# Pure MCUboot at 0x0 — no Nordic MBR/softdevice underneath (same as the
# app's board conf; keeps the whole flash map self-consistent)
CONFIG_BOARD_HAS_NRF5_BOOTLOADER=n
