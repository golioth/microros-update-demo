services:
  microros-agent:
    image: microros/micro-ros-agent:kilted
    container_name: microros-agent
    restart: unless-stopped
    network_mode: host
    environment:
      # Fast DDS shared-memory transport silently drops data across
      # container /dev/shm boundaries — force UDP
      FASTDDS_BUILTIN_TRANSPORTS: UDPv4
    devices:
      - /dev/tikk-microros:/dev/tikk-microros
    command: serial --dev /dev/tikk-microros -b 115200 -v6
    # /dev/tikk-microros = udev symlink to the micro-ROS CDC (USB
    # interface 02), from host/70-tikk-serial-symlinks.rules — immune to
    # the ttyACM minor-number shifts on replug/reboot. Console shell
    # lives on /dev/tikk-console (USB interface 00).