# NCS v3.0.1 compatibility overlay for the pouch v0.2.0 gateway sample
# (frdm_rw612). The sample targets upstream Zephyr/vanilla mbedtls where
# MBEDTLS_PSA_CRYPTO_C directly provides the crypto surface; under NCS
# v3.0.1 the nrf_security backend must be enabled for pouch's mbedtls
# selects (PK_C/PEM_PARSE_C/...) to resolve. Mirrors what the Tikk device
# app does in its prj.conf (MBEDTLS_LEGACY_CRYPTO_C for raw EC APIs).

CONFIG_NRF_SECURITY=y

# pouch src/cert.c + gateway/src/cert.c use raw mbedtls EC APIs; on
# NCS v3.0.1 those only exist under the legacy crypto surface
CONFIG_MBEDTLS_LEGACY_CRYPTO_C=y
